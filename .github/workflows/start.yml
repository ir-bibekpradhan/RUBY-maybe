name: Ruby build latest with mise
on:
  workflow_dispatch:

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - uses: actions/checkout@v4

      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          mode: docker-intercept

      - name: Install and activate mise
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          
          # Install mise
          curl -sSL https://mise.run | sh
          
          # Activate mise for this shell session
          eval "$($HOME/.local/bin/mise activate bash)"
          
          # Install Ruby version from mise.toml
          mise install
          
          # Use mise-managed Ruby
          mise use ruby
          
          # Verify correct Ruby version
          ruby -v

      - name: Install dependencies with Bundler
        run: |
          # Use mise Ruby — install bundler locally
          export PATH="$HOME/.local/bin:$PATH"
          eval "$($HOME/.local/bin/mise activate bash)"
          
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$($HOME/.local/bin/mise activate bash)"
          bundle exec rake test || echo "No tests defined"

      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@latest
        with:
          cleanup: "true"

  gather_analytics:
    runs-on: ubuntu-latest
    name: Gather Analytics
    needs: RUBY
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          send_job_status: "true"
