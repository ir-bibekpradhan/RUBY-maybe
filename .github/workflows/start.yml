name: Ruby build latest with mise
on:
  workflow_dispatch:

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - uses: actions/checkout@v4

      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          mode: docker-intercept

      - name: Install and Use Ruby via mise
        run: |
          # Add mise to PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # Install mise
          curl -sSL https://mise.run | sh
          
          # Activate mise for this shell session
          eval "$($HOME/.local/bin/mise activate bash)"
          
          # Install Ruby version from mise.toml
          mise install
          
          # Use the installed Ruby version
          mise use ruby
          
          # Verify Ruby version — should be 3.4.1
          ruby -v
          
          # Install Bundler in mise Ruby (avoids permission issues)
          gem install bundler --no-document
          
          # Install all gem dependencies
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: bundle exec rake test || echo "No tests defined"

      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@latest
        with:
          cleanup: "true"

  gather_analytics:
    runs-on: ubuntu-latest
    name: Gather Analytics
    needs: RUBY
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          send_job_status: "true"
