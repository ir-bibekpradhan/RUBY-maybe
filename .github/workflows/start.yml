name: Ruby build latest with mise
on:
  workflow_dispatch:

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - uses: actions/checkout@v4

      - name: Setup PSE
        uses: invisirisk/pse-action@develop
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}

      - name: Install and activate mise
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          curl -sSL https://mise.run | sh
          eval "$($HOME/.local/bin/mise activate bash)"
          mise install
          mise use ruby
          ruby -v

      # Cache gems
      - name: Cache Ruby gems
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies with Bundler
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$($HOME/.local/bin/mise activate bash)"
          
          # Install bundler
          gem install bundler --no-document
          
          # Install gems into vendor/bundle for caching
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$($HOME/.local/bin/mise activate bash)"
          bundle exec rake test || echo "No tests defined"


  gather_analytics:
    runs-on: ubuntu-latest
    name: Gather Analytics
    needs: RUBY
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@develop
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          send_job_status: "true"
