name: Ruby build latest

on:
  workflow_dispatch:

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby with caching
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true

      - name: Show installed gems
        run: gem list
