name: Ruby build latest

on:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build

    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{secrets.IR_TOKEN}}
      # ============= InvisiRisk Setup End =============

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby with caching
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true

      - name: Show installed gems
        run: gem list